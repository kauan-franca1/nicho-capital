[project]
name = "nicho"
version = "0.1.0"
description = "Pipeline de dados do Nicho Capital: ingestão, extração com IA, estatística e grafos."
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "arch>=7",
    "feedparser>=6.0.14",
    "httpx>=0.27",
    "networkx>=3.3",
    "pandas>=2.2",
    "psycopg[binary]>=3.2",
    "pydantic>=2.8",
    "pymupdf>=1.24",
    "pyyaml>=6.0",
    "ruptures>=1.1.9",
    "scipy>=1.13",
    "sentence-transformers>=3",
    "statsmodels>=0.14",
    "structlog>=24.1",
    "tenacity>=9.0",
    "torch>=2.4",
    "transformers>=4.44",
    "typer>=0.12",
    "yfinance>=1.7",
]

[project.scripts]
nicho = "nicho.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pandas-stubs>=3.1.0.261029",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "scipy-stubs>=1.18.1.1",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nicho"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Notação matemática em português nos docstrings e comentários é intencional.
allowed-confusables = ["−", "×", "α", "β", "σ", "ε", "ω", "ρ", "ν"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["nicho"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "db: precisa de um Postgres em DATABASE_URL (pulado se a variável não existir)",
]
addopts = "-ra"

[tool.coverage.run]
source = ["nicho"]

[[tool.mypy.overrides]]
module = [
    "yfinance", "yfinance.*", "ruptures", "ruptures.*", "arch", "arch.*",
    "feedparser", "feedparser.*", "pymupdf", "pymupdf.*",
    "sentence_transformers", "sentence_transformers.*", "transformers", "transformers.*",
    "networkx", "networkx.*",
]
ignore_missing_imports = true

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]


# torch só CPU: o wheel padrão do PyPI no Linux traz CUDA (gigabytes) e a CI não tem GPU.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
