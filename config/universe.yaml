# Universo de ativos do Nicho Capital.
# Tickers validados em 31/10/2026 contra o Yahoo Finance (sufixo .SA).
# Mudanças recentes de código: Eletrobras -> AXIA3, Embraer -> EMBJ3, BRF/Marfrig -> MBRF3,
# CCR -> MOTV3, Copel -> CPLE3. JBS (JBSS3) saiu da B3 e não entra.
# O CNPJ é resolvido pelo FCA da CVM (Codigo_Negociacao → CNPJ). `cnpj` só aparece aqui quando o
# FCA traz código inválido (verificado em 31/10/2026: BTG "000000", CSN "4030", Marfrig "ADR";
# os CNPJs abaixo são os desses mesmos registros do FCA).
# "apelidos" alimentam a busca de notícias. O casamento diferencia maiúsculas e ignora acentos,
# então "Vale" e "Localiza" (nomes) não casam com "vale" e "localiza" (palavras comuns).

