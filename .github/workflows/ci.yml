name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    name: Pipeline (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: nicho
          POSTGRES_PASSWORD: nicho
          POSTGRES_DB: nicho
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nicho -d nicho"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://nicho:nicho@localhost:5432/nicho
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --python 3.12 --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest --cov=nicho --cov-report=term-missing
      - name: CLI ponta a ponta contra o Postgres
        run: |
          uv run nicho validar-config
          uv run nicho migrate
          uv run nicho migrate
          uv run nicho sync-universo --gatilho ci

  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          DEMO_MODE: "true"
