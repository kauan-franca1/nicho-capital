# Pipeline agendado (fase 7). Horários em UTC; Brasília = UTC−3, sem horário de verão.
#   - "0 12 * * 1-5"   → 09:00 (briefing antes das 10h)
#   - "30 21 * * 1-5"  → 18:30 (pós-fechamento)
#   - "0 15 * * 0,6"   → só heartbeat no fim de semana (Supabase Free pausa após 7 dias sem uso)
# Às segundas, o run das 09:00 também versiona o snapshot demo/. O commit mantém o repositório
# ativo, o que evita o GitHub desligar o cron após 60 dias sem atividade. Ver ADR 0003.
name: Pipeline

on:
  schedule:
    - cron: "0 12 * * 1-5"
    - cron: "30 21 * * 1-5"
    - cron: "0 15 * * 0,6"
  workflow_dispatch:
    inputs:
      snapshot:
        description: "Versionar o snapshot demo/ ao final"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  heartbeat:
    if: github.event.schedule == '0 15 * * 0,6'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: pipeline
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --python 3.12 --locked --no-dev
      - run: uv run nicho heartbeat --gatilho github_actions

  run:
    if: github.event.schedule != '0 15 * * 0,6'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # só para o commit semanal do snapshot
    defaults:
      run:
        working-directory: pipeline
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BRAPI_TOKEN: ${{ secrets.BRAPI_TOKEN }}
      COLLECTOR_USER_AGENT: ${{ vars.COLLECTOR_USER_AGENT }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --python 3.12 --locked --no-dev
      - run: uv run nicho migrate
      - run: uv run nicho ingest precos --gatilho github_actions
      - run: uv run nicho ingest macro --gatilho github_actions
      - run: uv run nicho stats --gatilho github_actions
      - name: Cache dos modelos do Hugging Face
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('config/nlp.yaml') }}
      - run: uv run nicho ingest noticias --gatilho github_actions
      - run: uv run nicho enriquecer --gatilho github_actions
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      - run: uv run nicho pontuar --gatilho github_actions
      - run: uv run nicho grafos --gatilho github_actions
      - run: uv run nicho pontuar --gatilho github_actions # com a centralidade do grafo
      - run: uv run nicho briefing --gatilho github_actions
      - name: Snapshot semanal do modo demo
        if: inputs.snapshot || github.event.schedule == '0 12 * * 1-5'
        run: |
          if [ "${{ inputs.snapshot }}" != "true" ] && [ "$(date -u +%u)" != "1" ]; then
            echo "Não é segunda-feira: sem snapshot."
            exit 0
          fi
          uv run nicho export-demo --gatilho github_actions
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add demo
          if git diff --cached --quiet; then
            echo "Snapshot sem mudanças."
            exit 0
          fi
          git commit -m "chore(demo): snapshot semanal $(date -u +%F)"
          git push
